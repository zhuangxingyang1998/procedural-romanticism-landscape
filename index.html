    float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
    return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
  }

  float hash12(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }

  void main() {
    vec3 col = texture(uSceneTex, vUV).rgb;
    vec3 rays = texture(uGodRaysTex, vUV).rgb;
    vec3 bloom = texture(uBloomTex, vUV).rgb;

    col += rays * 0.92 + bloom * 0.42;

    // 19th-century Romanticism color grading & Filmic exposure
    col *= 1.06;
    col = acesFilmic(col);

    // Subtle warm-highlight / cool-shadow split tone
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    vec3 shadowTint = vec3(0.94, 0.98, 1.05);
    vec3 highTint   = vec3(1.04, 1.00, 0.93);
    col *= mix(shadowTint, highTint, smoothstep(0.15, 0.85, lum));

    // Gentle framing vignette
    vec2 q = vUV * 2.0 - 1.0;
    float vig = 1.0 - dot(q * vec2(0.85, 1.0), q * vec2(0.85, 1.0)) * 0.24;
    col *= clamp(vig, 0.62, 1.0);

    // Gamma encode sRGB + 1-LSB dither to eliminate sky banding
    col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));
    col += (hash12(gl_FragCoord.xy) - 0.5) * (1.0 / 255.0);

    fragColor = vec4(col, 1.0);
  }`;

  // =========================================================================
  // 7. Compile Programs & Allocate Render Targets
  // =========================================================================
  let progBackdrop, progWorld, progLeaves, progWater, progGodRays, progParticles, progExtract, progBlur, progFinal;
  try {
    progBackdrop = createProgram(FULLSCREEN_VS, BACKDROP_FS);
    progWorld = createProgram(WORLD_MESH_VS, WORLD_MESH_FS);
    progLeaves = createProgram(LEAVES_VS, LEAVES_FS);
    progWater = createProgram(FULLSCREEN_VS, WATER_FS);
    progGodRays = createProgram(FULLSCREEN_VS, GODRAYS_FS);
    progParticles = createProgram(PARTICLE_VS, PARTICLE_FS);
    progExtract = createProgram(FULLSCREEN_VS, BLOOM_EXTRACT_FS);
    progBlur = createProgram(FULLSCREEN_VS, BLUR_FS);
    progFinal = createProgram(FULLSCREEN_VS, FINAL_COMPOSITE_FS);
  } catch (e) {
    showError(e.message);
    return;
  }

  let fboBackdrop, fboBackdropRefl, fboBackdropFast, fboBackdropReflFast, fboMain, fboRefl, fboWater, fboGodRays, fboBloomA, fboBloomB;
  try {
    fboBackdrop         = createFBO(WIDTH, HEIGHT, { hdr: true });
    fboBackdropRefl     = createFBO(1280, 720, { hdr: true });
    fboBackdropFast     = createFBO(960, 540, { hdr: true });
    fboBackdropReflFast = createFBO(640, 360, { hdr: true });
    fboMain             = createFBO(WIDTH, HEIGHT, { hdr: true, withDepth: true });
    fboRefl             = createFBO(1280, 720, { hdr: true, withDepth: true });
    fboWater            = createFBO(WIDTH, HEIGHT, { hdr: true });
    fboGodRays          = createFBO(960, 540, { hdr: true });
    fboBloomA           = createFBO(480, 270, { hdr: true });
    fboBloomB           = createFBO(480, 270, { hdr: true });
  } catch (e) {
    showError(e.message);
    return;
  }

  // Camera & Lighting setup (Romanticism low-sunrise composition + Free 3D Explore)
  const HERO_POS = [0.0, 2.55, 0.0];
  const HERO_YAW = 0.0;
  const HERO_PITCH = 0.01;

  let camPos = HERO_POS.slice();
  let camYaw = HERO_YAW;
  let camPitch = HERO_PITCH;
  let targetCamPos = HERO_POS.slice();
  let targetYaw = HERO_YAW;
  let targetPitch = HERO_PITCH;

  const projMat = mat4Perspective(46 * Math.PI / 180, WIDTH / HEIGHT, 0.4, 5000.0);
  let viewMat, viewProjMat, invViewProjMat;
  let camForward, camRight, camUp;
  let sunScreenUV = [0.5, 0.5];
  let sunVis = 1.0;

  // Sun direction: shining through central-left alpine pass at sunrise
  const sunDir = norm3([-0.18, 0.145, 0.972]);

  function updateCameraMatrices() {
    const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    const sy = Math.sin(camYaw), cy = Math.cos(camYaw);
    camForward = norm3([sy * cp, sp, cy * cp]);
    camRight = norm3(cross3(camForward, [0, 1, 0]));
    camUp = norm3(cross3(camRight, camForward));

    const target = add3(camPos, mul3(camForward, 50.0));
    viewMat = mat4LookAt(camPos, target, [0, 1, 0]);
    viewProjMat = mat4Mul(projMat, viewMat);
    invViewProjMat = mat4Invert(viewProjMat);

    const p = [camPos[0] + sunDir[0] * 1000, camPos[1] + sunDir[1] * 1000, camPos[2] + sunDir[2] * 1000];
    const m = viewProjMat;
    const cx = m[0]*p[0] + m[4]*p[1] + m[8]*p[2] + m[12];
    const cyP = m[1]*p[0] + m[5]*p[1] + m[9]*p[2] + m[13];
    const cw = m[3]*p[0] + m[7]*p[1] + m[11]*p[2] + m[15];
    const fwdDot = dot3(camForward, sunDir);
    sunVis = clamp(fwdDot * 2.5, 0.0, 1.0);
    if (cw > 0.01) {
      sunScreenUV = [(cx / cw) * 0.5 + 0.5, (cyP / cw) * 0.5 + 0.5];
    } else {
      sunScreenUV = [0.5, 0.5];
      sunVis = 0.0;
    }
  }
  updateCameraMatrices();

  // =========================================================================
  // 8. Seed State & GPU Buffer Upload
  // =========================================================================
  let sceneGPU = null;

  function disposeSceneGPU() {
    if (!sceneGPU) return;
    gl.deleteTexture(sceneGPU.textures.leafTex);
    gl.deleteTexture(sceneGPU.textures.matTex);
    gl.deleteVertexArray(sceneGPU.terrainVAO);
    gl.deleteVertexArray(sceneGPU.propsVAO);
    gl.deleteVertexArray(sceneGPU.leavesVAO);
    gl.deleteVertexArray(sceneGPU.particleVAO);
    for (const b of sceneGPU.buffers) gl.deleteBuffer(b);
    sceneGPU = null;
  }

  function buildMeshVAO(pos, nor, uv, meta, indices, buffers) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    const makeVBO = (arr, loc, size) => {
      const b = gl.createBuffer();
      buffers.push(b);
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, arr instanceof Float32Array ? arr : new Float32Array(arr), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    };

    makeVBO(pos, 0, 3);
    makeVBO(nor, 1, 3);
    makeVBO(uv, 2, 2);
    makeVBO(meta, 3, 4);

    const ibo = gl.createBuffer();
    buffers.push(ibo);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    const idxArr = indices instanceof Uint32Array ? indices : new Uint32Array(indices);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idxArr, gl.STATIC_DRAW);

    gl.bindVertexArray(null);
    return { vao, indexCount: idxArr.length };
  }

  function renderBackdropFBO(fbo, mirrorY, seedOffset) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fbo);
    gl.viewport(0, 0, fbo.w, fbo.h);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(progBackdrop);
    gl.uniformMatrix4fv(gl.getUniformLocation(progBackdrop, 'uInvViewProj'), false, invViewProjMat);
    gl.uniform3fv(gl.getUniformLocation(progBackdrop, 'uCamPos'), camPos);
    gl.uniform3fv(gl.getUniformLocation(progBackdrop, 'uSunDir'), sunDir);
    gl.uniform1f(gl.getUniformLocation(progBackdrop, 'uMirrorY'), mirrorY);
    gl.uniform1f(gl.getUniformLocation(progBackdrop, 'uSeedOffset'), seedOffset);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  function rebuildWorld(seedInputStr) {
    const t0 = performance.now();
    const numericSeed = /^\d+$/.test(seedInputStr.trim())
      ? parseInt(seedInputStr.trim(), 10)
      : hashString(seedInputStr.trim() || '1874');

    disposeSceneGPU();
    const buffers = [];
    const textures = buildProceduralTextures(numericSeed);
    const terrain = createTerrainModel(numericSeed);
    const forest = buildFractalForest(terrain, numericSeed);
    const particles = createParticles(numericSeed);

    const terrainVAOInfo = buildMeshVAO(terrain.pos, terrain.nor, terrain.uv, terrain.meta, terrain.indices, buffers);
    const propsVAOInfo = buildMeshVAO(forest.mesh.pos, forest.mesh.nor, forest.mesh.uv, forest.mesh.meta, forest.mesh.idx, buffers);

    // Instanced leaves VAO
    const leavesVAO = gl.createVertexArray();
    gl.bindVertexArray(leavesVAO);
    const lqBuf = gl.createBuffer();
    buffers.push(lqBuf);
    gl.bindBuffer(gl.ARRAY_BUFFER, lqBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    const leafInstBuf = gl.createBuffer();
    buffers.push(leafInstBuf);
    gl.bindBuffer(gl.ARRAY_BUFFER, leafInstBuf);
    gl.bufferData(gl.ARRAY_BUFFER, forest.leafData, gl.STATIC_DRAW);
    const stride = 12 * 4;
    for (let attr = 0; attr < 3; attr++) {
      gl.enableVertexAttribArray(1 + attr);
      gl.vertexAttribPointer(1 + attr, 4, gl.FLOAT, false, stride, attr * 16);
      gl.vertexAttribDivisor(1 + attr, 1);
    }
    gl.bindVertexArray(null);

    // Particles VAO
    const particleVAO = gl.createVertexArray();
    gl.bindVertexArray(particleVAO);
    const pBuf = gl.createBuffer();
    buffers.push(pBuf);
    gl.bindBuffer(gl.ARRAY_BUFFER, pBuf);
    gl.bufferData(gl.ARRAY_BUFFER, particles.data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 32, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 16);
    gl.bindVertexArray(null);

    const seedOffset = (numericSeed % 997) * 0.37;
    renderBackdropFBO(fboBackdrop, 0.0, seedOffset);
    renderBackdropFBO(fboBackdropRefl, 1.0, seedOffset);

    sceneGPU = {
      textures,
      terrainVAO: terrainVAOInfo.vao,
      terrainIdxCount: terrainVAOInfo.indexCount,
      propsVAO: propsVAOInfo.vao,
      propsIdxCount: propsVAOInfo.indexCount,
      leavesVAO,
      leafCount: forest.leafCount,
      particleVAO,
      particleCount: particles.count,
      seedOffset,
      buffers
    };

    const elapsed = Math.round(performance.now() - t0);
    statusEl.textContent = `${forest.leafCount.toLocaleString()} 叶 · ${elapsed}ms`;
  }

  // =========================================================================
  // 9. Real-Time Micro-Motion Render Loop
  // =========================================================================
  // Dedicated 1-to-1 HDR texture blit shader
  const BLIT_FS = `#version 300 es
  precision highp float;
  in vec2 vUV;
  out vec4 fragColor;
  uniform sampler2D uTex;
  void main() { fragColor = texture(uTex, vUV); }`;
  const progBlit = createProgram(FULLSCREEN_VS, BLIT_FS);

  function drawScenePass(targetFBO, backdropTex, mirrorY, timeSec) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, targetFBO.fbo);
    gl.viewport(0, 0, targetFBO.w, targetFBO.h);
    gl.clearDepth(1.0);
    gl.clear(gl.DEPTH_BUFFER_BIT);

    // 1. Copy precomputed HDR sky + raymarched self-shadowed mountain backdrop
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
    gl.useProgram(progBlit);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, backdropTex);
    gl.uniform1i(gl.getUniformLocation(progBlit, 'uTex'), 0);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 2. Render 3D World Meshes (Terrain, Lakebed, Mossy Boulders, Ancient Trunks, Ferns, Glowing Wildflowers)
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);
    gl.useProgram(progWorld);
    gl.uniformMatrix4fv(gl.getUniformLocation(progWorld, 'uViewProj'), false, viewProjMat);
    gl.uniform3fv(gl.getUniformLocation(progWorld, 'uCamPos'), camPos);
    gl.uniform3fv(gl.getUniformLocation(progWorld, 'uSunDir'), sunDir);
    gl.uniform1f(gl.getUniformLocation(progWorld, 'uTime'), timeSec);
    gl.uniform1f(gl.getUniformLocation(progWorld, 'uMirrorY'), mirrorY);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneGPU.textures.matTex);
    gl.uniform1i(gl.getUniformLocation(progWorld, 'uMatTex'), 0);

    // Terrain
    gl.bindVertexArray(sceneGPU.terrainVAO);
    gl.drawElements(gl.TRIANGLES, sceneGPU.terrainIdxCount, gl.UNSIGNED_INT, 0);

    // Rocks, Trees, Ferns, Wildflowers
    gl.bindVertexArray(sceneGPU.propsVAO);
    gl.drawElements(gl.TRIANGLES, sceneGPU.propsIdxCount, gl.UNSIGNED_INT, 0);

    // 3. Render 14,000+ Individually Shaded Leaves & Pine Needles (Instanced)
    gl.useProgram(progLeaves);
    gl.uniformMatrix4fv(gl.getUniformLocation(progLeaves, 'uViewProj'), false, viewProjMat);
    gl.uniform3fv(gl.getUniformLocation(progLeaves, 'uCamRight'), camRight);
    gl.uniform3fv(gl.getUniformLocation(progLeaves, 'uCamUp'), camUp);
    gl.uniform3fv(gl.getUniformLocation(progLeaves, 'uCamPos'), camPos);
    gl.uniform3fv(gl.getUniformLocation(progLeaves, 'uSunDir'), sunDir);
    gl.uniform1f(gl.getUniformLocation(progLeaves, 'uTime'), timeSec);
    gl.uniform1f(gl.getUniformLocation(progLeaves, 'uMirrorY'), mirrorY);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneGPU.textures.leafTex);
    gl.uniform1i(gl.getUniformLocation(progLeaves, 'uLeafTex'), 0);
    gl.bindVertexArray(sceneGPU.leavesVAO);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, sceneGPU.leafCount);
    gl.bindVertexArray(null);
  }

  function renderFrame(timeSec, useFastBackdrop = false) {
    if (!sceneGPU) return;

    const bgMain = useFastBackdrop ? fboBackdropFast.colorTex : fboBackdrop.colorTex;
    const bgRefl = useFastBackdrop ? fboBackdropReflFast.colorTex : fboBackdropRefl.colorTex;

    // Pass 1A: Mirrored Planar Reflection Scene
    drawScenePass(fboRefl, bgRefl, 1.0, timeSec);

    // Pass 1B: Main Scene + Crystal-Clear Submerged Lakebed
    drawScenePass(fboMain, bgMain, 0.0, timeSec);

    // Pass 2: Water Surface Compositing (Fresnel + Refracted Bed + Rippled Reflection + Sun Path)
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboWater.fbo);
    gl.viewport(0, 0, fboWater.w, fboWater.h);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(progWater);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboMain.colorTex);
    gl.uniform1i(gl.getUniformLocation(progWater, 'uMainTex'), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fboMain.depthTex);
    gl.uniform1i(gl.getUniformLocation(progWater, 'uMainDepthTex'), 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, fboRefl.colorTex);
    gl.uniform1i(gl.getUniformLocation(progWater, 'uReflTex'), 2);
    gl.uniformMatrix4fv(gl.getUniformLocation(progWater, 'uInvViewProj'), false, invViewProjMat);
    gl.uniform3fv(gl.getUniformLocation(progWater, 'uCamPos'), camPos);
    gl.uniform3fv(gl.getUniformLocation(progWater, 'uSunDir'), sunDir);
    gl.uniform1f(gl.getUniformLocation(progWater, 'uTime'), timeSec);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Pass 3: Additive Atmospheric Particles (Pollen, Glowing Spores, Lake Mist) directly into fboWater
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(progParticles);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboMain.depthTex);
    gl.uniform1i(gl.getUniformLocation(progParticles, 'uMainDepthTex'), 0);
    gl.uniformMatrix4fv(gl.getUniformLocation(progParticles, 'uViewProj'), false, viewProjMat);
    gl.uniform1f(gl.getUniformLocation(progParticles, 'uTime'), timeSec);
    gl.bindVertexArray(sceneGPU.particleVAO);
    gl.drawArrays(gl.POINTS, 0, sceneGPU.particleCount);
    gl.disable(gl.BLEND);

    // Pass 4: Volumetric God Rays (Radial Raymarch from Sun through Canopy Gaps)
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboGodRays.fbo);
    gl.viewport(0, 0, fboGodRays.w, fboGodRays.h);
    gl.useProgram(progGodRays);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboMain.colorTex);
    gl.uniform1i(gl.getUniformLocation(progGodRays, 'uSceneTex'), 0);
    gl.uniform2fv(gl.getUniformLocation(progGodRays, 'uSunScreenUV'), sunScreenUV);
    gl.uniform1f(gl.getUniformLocation(progGodRays, 'uSunVis'), sunVis);
    gl.uniform1f(gl.getUniformLocation(progGodRays, 'uTime'), timeSec);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Pass 5: HDR Bloom Extract & Separable Blur
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboBloomA.fbo);
    gl.viewport(0, 0, fboBloomA.w, fboBloomA.h);
    gl.useProgram(progExtract);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboWater.colorTex);
    gl.uniform1i(gl.getUniformLocation(progExtract, 'uTex'), 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.useProgram(progBlur);
    for (let pass = 0; pass < 2; pass++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, fboBloomB.fbo);
      gl.bindTexture(gl.TEXTURE_2D, fboBloomA.colorTex);
      gl.uniform1i(gl.getUniformLocation(progBlur, 'uTex'), 0);
      gl.uniform2f(gl.getUniformLocation(progBlur, 'uDir'), 1.0 / fboBloomA.w, 0.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      gl.bindFramebuffer(gl.FRAMEBUFFER, fboBloomA.fbo);
      gl.bindTexture(gl.TEXTURE_2D, fboBloomB.colorTex);
      gl.uniform2f(gl.getUniformLocation(progBlur, 'uDir'), 0.0, 1.0 / fboBloomA.h);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    // Pass 6: Final 1920x1080 Filmic Tone Mapping & Romanticism Grading to Canvas
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, WIDTH, HEIGHT);
    gl.useProgram(progFinal);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboWater.colorTex);
    gl.uniform1i(gl.getUniformLocation(progFinal, 'uSceneTex'), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fboGodRays.colorTex);
    gl.uniform1i(gl.getUniformLocation(progFinal, 'uGodRaysTex'), 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, fboBloomA.colorTex);
    gl.uniform1i(gl.getUniformLocation(progFinal, 'uBloomTex'), 2);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);
  }

  // =========================================================================
  // 10. Free 3D Camera Controls & Animation Loop
  // =========================================================================
  let paused = false;
  let simTime = 0.0;
  let lastNow = performance.now();

  const keysDown = new Set();
  let isDragging = false;
  let lastMouseX = 0, lastMouseY = 0;
  let backdropNeedsFullRes = false;
  let lastCamMoveAt = 0;

  function clampTargetCamera() {
    targetCamPos[0] = clamp(targetCamPos[0], -85.0, 85.0);
    targetCamPos[1] = clamp(targetCamPos[1], 0.45, 58.0);
    targetCamPos[2] = clamp(targetCamPos[2], -35.0, 132.0);
    targetPitch = clamp(targetPitch, -1.25, 1.25);
  }

  function resetCamera() {
    targetCamPos = HERO_POS.slice();
    targetYaw = HERO_YAW;
    targetPitch = HERO_PITCH;
  }

  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    // Dragging left turns view left (+yaw), dragging up tilts view up (+pitch)
    targetYaw -= dx * 0.0032;
    targetPitch -= dy * 0.0032;
    clampTargetCamera();
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const step = -Math.sign(e.deltaY) * 2.8;
    targetCamPos[0] += camForward[0] * step;
    targetCamPos[1] += camForward[1] * step;
    targetCamPos[2] += camForward[2] * step;
    clampTargetCamera();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (document.activeElement === seedInput) return;
    const k = e.key.toLowerCase();
    keysDown.add(k);
    if (k === 'h') hud.classList.toggle('hidden');
    if (k === 'r') resetCamera();
  });

  window.addEventListener('keyup', (e) => {
    keysDown.delete(e.key.toLowerCase());
  });

  function tick(now) {
    const dt = Math.min(0.05, (now - lastNow) * 0.001);
    lastNow = now;

    // Keyboard flight movement
    const speed = (keysDown.has('shift') ? 26.0 : 11.5) * dt;
    const flatFwd = norm3([Math.sin(targetYaw), 0, Math.cos(targetYaw)]);
    const flatRight = norm3(cross3(flatFwd, [0, 1, 0]));
    if (keysDown.has('w') || keysDown.has('arrowup')) {
      targetCamPos[0] += flatFwd[0] * speed;
      targetCamPos[2] += flatFwd[2] * speed;
    }
    if (keysDown.has('s') || keysDown.has('arrowdown')) {
      targetCamPos[0] -= flatFwd[0] * speed;
      targetCamPos[2] -= flatFwd[2] * speed;
    }
    if (keysDown.has('d') || keysDown.has('arrowright')) {
      targetCamPos[0] += flatRight[0] * speed;
      targetCamPos[2] += flatRight[2] * speed;
    }
    if (keysDown.has('a') || keysDown.has('arrowleft')) {
      targetCamPos[0] -= flatRight[0] * speed;
      targetCamPos[2] -= flatRight[2] * speed;
    }
    if (keysDown.has('e') || keysDown.has(' ')) targetCamPos[1] += speed * 0.85;
    if (keysDown.has('q') || keysDown.has('c')) targetCamPos[1] -= speed * 0.85;
    clampTargetCamera();

    // Smooth camera damping
    const damp = 1.0 - Math.exp(-12.0 * dt);
    const prevX = camPos[0], prevY = camPos[1], prevZ = camPos[2], prevYaw = camYaw, prevPitch = camPitch;
    camPos[0] = mix(camPos[0], targetCamPos[0], damp);
    camPos[1] = mix(camPos[1], targetCamPos[1], damp);
    camPos[2] = mix(camPos[2], targetCamPos[2], damp);
    camYaw = mix(camYaw, targetYaw, damp);
    camPitch = mix(camPitch, targetPitch, damp);

    const moved =
      Math.abs(camPos[0] - prevX) + Math.abs(camPos[1] - prevY) + Math.abs(camPos[2] - prevZ) +
      Math.abs(camYaw - prevYaw) * 10.0 + Math.abs(camPitch - prevPitch) * 10.0 > 0.0005;

    if (moved && sceneGPU) {
      updateCameraMatrices();
      renderBackdropFBO(fboBackdropFast, 0.0, sceneGPU.seedOffset);
      renderBackdropFBO(fboBackdropReflFast, 1.0, sceneGPU.seedOffset);
      backdropNeedsFullRes = true;
      lastCamMoveAt = now;
    } else if (backdropNeedsFullRes && (now - lastCamMoveAt > 140) && sceneGPU) {
      updateCameraMatrices();
      renderBackdropFBO(fboBackdrop, 0.0, sceneGPU.seedOffset);
      renderBackdropFBO(fboBackdropRefl, 1.0, sceneGPU.seedOffset);
      backdropNeedsFullRes = false;
      if (paused) renderFrame(simTime, false);
    }

    if (!paused) {
      simTime += dt;
      renderFrame(simTime, backdropNeedsFullRes);
    } else if (moved) {
      renderFrame(simTime, true);
    }

    requestAnimationFrame(tick);
  }

  document.getElementById('applySeedBtn').addEventListener('click', () => {
    rebuildWorld(seedInput.value);
    renderFrame(simTime, false);
  });

  document.getElementById('randSeedBtn').addEventListener('click', () => {
    const s = Math.floor(1000 + Math.random() * 89999);
    seedInput.value = String(s);
    rebuildWorld(seedInput.value);
    renderFrame(simTime, false);
  });

  seedInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      rebuildWorld(seedInput.value);
      renderFrame(simTime, false);
    }
  });

  document.getElementById('resetCamBtn').addEventListener('click', resetCamera);

  const pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '继续微动' : '暂停微动';
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    if (backdropNeedsFullRes && sceneGPU) {
      renderBackdropFBO(fboBackdrop, 0.0, sceneGPU.seedOffset);
      renderBackdropFBO(fboBackdropRefl, 1.0, sceneGPU.seedOffset);
      backdropNeedsFullRes = false;
    }
    renderFrame(simTime, false);
    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `alpine_sunrise_${seedInput.value || '1874'}_1920x1080.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  });

  document.getElementById('hudToggle').addEventListener('click', () => {
    hud.classList.toggle('hidden');
  });

  // Initialize hero scene
  rebuildWorld(seedInput.value);
  renderFrame(0.0, false);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
